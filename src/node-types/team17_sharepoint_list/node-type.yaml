schema_version: 1
code: team17_sharepoint_list
name: SharePoint List
description: Read and write items in SharePoint Lists through Microsoft Graph.
category: integrations
icon:
  lucide: list-checks
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: decorator
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 120
capabilities: [credentials, http]
dependencies: []
io:
  input_data: {}
  output_data:
    result: Microsoft Graph result or a safe error
form:
  fields:
    - {name: credential_mode, type: select, label: Credential mode, required: 1, default: team, choices: [{name: Team credential, value: team}, {name: Personal credential, value: personal}]}
    - {name: credential_code, type: text, label: Studio Microsoft credential code, required: 1, max_length: 200, resolve_variables: false}
    - {name: action, type: select, label: Action, required: 1, default: list_items, choices: [{name: List items, value: list_items}, {name: Get item, value: get_item}, {name: Create item, value: create_item}, {name: Update item, value: update_item}]}
    - {name: site_id, type: text, label: Site ID, required: 1, max_length: 500}
    - {name: list_id, type: text, label: List ID, required: 1, max_length: 500}
    - {name: item_id, type: text, label: Item ID, required: 0, max_length: 200}
    - {name: fields, type: json, label: List item fields JSON, required: 0, default: '{}'}
    - {name: input_keys, type: text, label: Input keys, required: 0, default: ''}
    - {name: output_key, type: text, label: Output key, required: 0, default: result}
  layout:
    - id: tab-settings
      sections:
        - id: section-properties
          fields: [credential_mode, credential_code, action, site_id, list_id, item_id, fields, input_keys, output_key]
