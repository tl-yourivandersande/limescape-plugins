name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run limescape-plugin build --version "$version" --git-sha "$GITHUB_SHA" --out dist > build.txt
          cat build.txt
          activation="$(sed -n 's/^activation_sha256=//p' build.txt)"
          test -n "$activation"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" \
            --notes "Activation sha256: \`$activation\`" --generate-notes
